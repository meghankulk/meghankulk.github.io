  <style>
    :root { --bg: #060a24; --bg-2: #0b1033; --ink: #ece6d8; --muted: #a3a6bc; --line: rgba(236, 230, 216, 0.28); --line-faint: rgba(236, 230, 216, 0.1); }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: "Jost", "Futura", system-ui, sans-serif; font-weight: 300; }
    body { min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; }
    .gate { width: min(100%, 380px); }
    .mark { font-family: "Instrument Serif", serif; font-style: italic; font-size: 44px; line-height: 1; margin: 0 0 28px; color: var(--ink); }
    h1 { font-weight: 300; font-size: 28px; letter-spacing: -0.01em; margin: 0 0 8px; }
    p { color: var(--muted); font-size: 16px; line-height: 1.6; margin: 0 0 24px; }
    label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 8px; }
    .row { display: flex; gap: 8px; }
    input { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--ink); background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
    input:focus { outline: none; border-color: var(--ink); }
    button { font: inherit; font-size: 16px; font-weight: 400; color: var(--bg); background: var(--ink); border: 0; border-radius: 8px; padding: 0 18px; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: progress; }
    .error { min-height: 22px; margin: 10px 0 0; font-size: 14px; color: #e8a6a0; }
    .embedded { color: var(--muted); font-size: 15px; text-align: center; }
    /* the moment between passcode and site: the mark with a thin line running under it */
    .loading { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: var(--bg); }
    .loading[hidden] { display: none; }
    .loading .mark { margin: 0 0 18px; text-align: center; }
    .track { position: relative; width: 120px; height: 1px; overflow: hidden; background: var(--line-faint); }
    .track::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 40%; background: var(--ink); animation: run 1.1s ease-in-out infinite; }
    @keyframes run { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { .track::after { animation: none; width: 100%; opacity: 0.5; } }
  </style>

        if (left > 0) await new Promise((done) => setTimeout(done, left));
        entered.set();
      }

      async function fromStore() {
        const raw = store.get();
        if (!raw) return false;
        const show = !embedded && !entered.get(), since = performance.now();
        if (show) loading.hidden = false;
        try {
          const key = await crypto.subtle.importKey('raw', bytes(raw), 'AES-GCM', false, ['decrypt']);
          if (show) await hold(since);
          await open(key);
          return true;
        } catch { store.clear(); loading.hidden = true; return false; }
      }

      async function fromPasscode(code, since) {
        const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
        const key = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: bytes(payload.salt), iterations: payload.iterations, hash: 'SHA-256' },
          material, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
        // Check the passcode before remembering it, and remember it before the page swaps in,
        // so the demos the page loads in iframes find the key straight away
        await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(payload.iv) }, key, bytes(payload.data));
        const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
        store.set(btoa(String.fromCharCode(...raw)));
        await hold(since);
        await open(key);
      }

      fromStore().then((done) => {
        if (done) return;
        if (embedded) { document.getElementById('embedded').hidden = false; return; }
        const gate = document.getElementById('gate'), form = document.getElementById('form');
        const input = document.getElementById('code'), go = document.getElementById('go'), error = document.getElementById('error');
        gate.hidden = false;
        input.focus();
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          go.disabled = true; error.textContent = ''; loading.hidden = false;
          try { await fromPasscode(input.value, performance.now()); }
          catch { loading.hidden = true; error.textContent = 'That passcode didn’t work. Try again.'; go.disabled = false; input.select(); }
        });
      });
    })();
  </script>
</body>
</html>
