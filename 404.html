<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found, Meghan Kulkarni</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /* Self-contained: a 404 can be served at any depth, so nothing here leans on relative paths */
    :root { --bg: #060a24; --ink: #ece6d8; --muted: #a3a6bc; --line: rgba(236, 230, 216, 0.28); --line-faint: rgba(236, 230, 216, 0.1); }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Jost", "Futura", system-ui, sans-serif; font-weight: 300; }
    body { min-height: 100svh; display: grid; grid-template-rows: auto 1fr; }
    header { padding: 24px clamp(20px, 5vw, 72px); }
    .mark { font-family: "Instrument Serif", serif; font-style: italic; font-size: 32px; color: var(--ink); text-decoration: none; }
    main { display: grid; place-items: center; padding: 0 16px 64px; text-align: center; }
    .scene { width: min(100%, 640px); height: auto; display: block; margin: 0 auto 32px; }
    .planned { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 3 7; }
    .flown { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-linecap: round; }
    .fix { fill: none; stroke: var(--line); stroke-width: 1.2; }
    .fix-label, .tag { font-family: "Jost", system-ui, sans-serif; font-size: 11px; letter-spacing: 0.12em; fill: var(--muted); }
    .tag { fill: var(--ink); }
    .plane { fill: var(--ink); }
    .drift { animation: drift 4s ease-in-out infinite alternate; transform-box: fill-box; }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(6px, -4px); } }
    @media (prefers-reduced-motion: reduce) { .drift { animation: none; } }
    .code { margin: 0 0 10px; font-size: 13px; letter-spacing: 0.16em; color: var(--muted); }
    h1 { margin: 0 0 10px; font-weight: 300; font-size: clamp(28px, 4vw, 44px); letter-spacing: -0.01em; text-wrap: balance; }
    p { margin: 0 0 28px; color: var(--muted); font-size: 17px; line-height: 1.6; }
    .home { display: inline-block; color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 4px; font-size: 17px; transition: border-color .3s; }
    .home:hover { border-color: var(--ink); }
  </style>
</head>
<body>
  <header><a class="mark" href="/" aria-label="Meghan Kulkarni, home">M.</a></header>
  <main>
    <div>
      <svg class="scene" viewBox="0 0 640 240" role="img" aria-label="A flight's planned route continues to its destination while the plane has drifted off it">
        <!-- planned route: origin to destination, dashed like the hero's lanes -->
        <path class="planned" d="M40 170 C 200 170, 300 120, 600 120"/>
        <circle class="fix" cx="40" cy="170" r="5"/>
        <text class="fix-label" x="40" y="200" text-anchor="middle">HOME</text>
        <circle class="fix" cx="600" cy="120" r="5"/>
        <text class="fix-label" x="600" y="150" text-anchor="middle">PAGE</text>
        <!-- what actually happened: the flight peels away from the route -->
        <path class="flown" d="M40 170 C 160 170, 230 158, 300 128 S 400 60, 452 52"/>
        <g class="drift">
          <use class="plane" href="#plane" transform="translate(462 48) rotate(-22)"/>
          <text class="tag" x="480" y="34">MK404 · OFF ROUTE</text>
        </g>
        <defs><path id="plane" d="M18 0C18-1.5 16-2 14-2H4L-4-14H-8L-3-2H-11L-15-7H-18L-15.5 0-18 7H-15L-11 2H-3L-8 14H-4L4 2H14C16 2 18 1.5 18 0Z"/></defs>
      </svg>
      <p class="code">404</p>
      <h1>This page isn’t on the flight plan.</h1>
      <p>The link may be old or mistyped.</p>
      <a class="home" href="/">Back to home</a>
    </div>
  </main>
</body>
</html>
